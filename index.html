<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Long Hổ Bead Road</title>

<style>
  body {
    font-family: 'Kanit', sans-serif;
    max-width: 700px;
    margin: 0 auto;
    padding: 10px;
  }

  table {
    border-collapse: collapse;
    table-layout: fixed;
    width: 100%;
  }

  td {
    border: 1px solid gray;
    width: 20px;
    height: 20px;
    text-align: center;
    vertical-align: middle;
    border-radius: 50%;
    font-weight: bold;
    font-size: 14px;
  }

  .L { background-color: red; color: white; }
  .H { background-color: gold; color: black; }
  .T { background-color: green; color: white; }

  .button {
    padding: 15px 30px;
    font-size: 18px;
    cursor: pointer;
    text-align: center;
    outline: none;
    color: #fff;
    border: none;
    border-radius: 10px;
    margin: 5px;
  }

  .long { background-color: red; }
  .ho { background-color: gold; color: black; }
  .undo { background-color: gray; }
  .clear { background-color: black; }

  #button {
    position: fixed;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
  }
</style>
</head>
<body>

<h2>Long Hổ Bead Road</h2>

<div id="beadroadtable">
  <table id="tblbeadroad">
    <tbody>
      <!-- 6 hàng × 32 cột -->
      <script>
        for(let r=1; r<=6; r++){
          document.write('<tr>');
          for(let c=1; c<=32; c++){
            document.write('<td id="cell_'+r+'_'+c+'"></td>');
          }
          document.write('</tr>');
        }
      </script>
    </tbody>
  </table>
</div>

<div id="button">
  <button class="button long" onclick="insert('L')">Long</button>
  <button class="button ho" onclick="insert('H')">Hổ</button>
  <button class="button undo" onclick="undo()">&lt;</button>
  <button class="button clear" onclick="clearTable()">C</button>
</div>

<script>
  let history = [];

  function insert(symbol) {
    history.push(symbol);
    updateTable();
  }

  function undo() {
    history.pop();
    updateTable();
  }

  function clearTable() {
    history = [];
    updateTable();
  }

  function updateTable() {
    const rows = 6;
    const cols = 32;

    // Xóa bảng
    for(let r=1;r<=rows;r++){
      for(let c=1;c<=cols;c++){
        const cell = document.getElementById('cell_'+r+'_'+c);
        cell.className = '';
        cell.innerText = '';
      }
    }

    // Vẽ lại theo kiểu Bead Road chuẩn (đổ cột)
    let col = 1;
    let row = 1;

    history.forEach((sym, idx) => {
      const cell = document.getElementById('cell_'+row+'_'+col);
      if(sym === 'L') { cell.className = 'L'; cell.innerText = 'L'; }
      if(sym === 'H') { cell.className = 'H'; cell.innerText = 'H'; }
      if(sym === 'T') { cell.className = 'T'; cell.innerText = 'T'; }

      row++;
      if(row > rows) {
        row = 1;
        col++;
        if(col > cols) col = cols; // tránh vượt bảng
      }
    });
  }
</script>

</body>
</html>
