<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Long Hổ Bead Road</title>
<style>
body { font-family: 'Kanit', sans-serif; max-width: 720px; margin:0 auto; padding:10px; background:#f9f9f9;}
table { border-collapse: collapse; table-layout: fixed; width:100%; }
td { border:1px solid gray; width:20px; height:20px; text-align:center; vertical-align:middle;}
td img { width:18px; height:18px; }
.button { padding:15px 30px; font-size:18px; cursor:pointer; outline:none; border:none; border-radius:10px; margin:5px; color:#fff; }
.long { background-color:red; }
.ho { background-color:gold; color:black; }
.oo { background-color:gray; }
.clear { background-color:black; }
#button { text-align:center; margin-bottom:20px; }
#beadroadtable { margin-top:20px; overflow-x:auto; }
</style>
</head>
<body>

<div id="button">
  <button class="button long" onclick="insert('L')">Long</button>
  <button class="button ho" onclick="insert('H')">Hổ</button>
  <button class="button oo" onclick="undo()">&lt;</button>
  <button class="button clear" onclick="clearTable()">C</button>
</div>

<div id="beadroadtable">
  <table id="tblbeadroad">
    <tbody>
      <!-- 6 hàng × 32 cột -->
      <script>
        for(let r=1;r<=6;r++){
          document.write('<tr>');
          for(let c=1;c<=32;c++){
            document.write('<td id="cell_'+r+'_'+c+'"></td>');
          }
          document.write('</tr>');
        }
      </script>
    </tbody>
  </table>
</div>

<script>
let history=[];

function insert(symbol){
  history.push(symbol); // L hoặc H
  updateTable();
}

function undo(){
  history.pop();
  updateTable();
}

function clearTable(){
  history=[];
  updateTable();
}

function updateTable(){
  const rows=6, cols=32;
  for(let r=1;r<=rows;r++){
    for(let c=1;c<=cols;c++){
      document.getElementById('cell_'+r+'_'+c).innerHTML='';
    }
  }

  let col=1,row=1;
  history.forEach(sym=>{
    const cell=document.getElementById('cell_'+row+'_'+col);
    // hiển thị ký tự thay cho ảnh để giữ giao diện
    cell.innerText=sym;
    row++;
    if(row>rows){
      row=1;
      col++;
      if(col>cols) col=cols;
    }
  });
}
</script>

</body>
</html>
